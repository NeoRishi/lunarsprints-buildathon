name: Verify LunarSprints
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only credentials for the service container above.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgres://ls_app:ci_app_password@localhost:5432/lunarsprints_dev
      DATABASE_URL_OWNER: postgres://ls_owner:ci_owner_password@localhost:5432/lunarsprints_dev
      DATABASE_URL_TEST: postgres://ls_app:ci_app_password@localhost:5432/lunarsprints_test
      FIREBASE_PROJECT_ID: lunarsprints-62d7d
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: lunarsprints-62d7d.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: lunarsprints-62d7d
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-emulator-app
      NEXT_PUBLIC_USE_AUTH_EMULATOR: "true"
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run db:setup
      - run: npm run db:migrate:test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rls
      - run: npm run test:auth
      - run: npm run build
